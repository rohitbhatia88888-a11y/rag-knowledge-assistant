[project]
name = "rag-assistant"
version = "0.1.0"
description = "Enterprise RAG knowledge assistant: permission-aware hybrid retrieval with cited answers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
    "arq>=0.26",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "openai>=1.40",
    "pymupdf>=1.24",
    "pyjwt[crypto]>=2.9",
    "langfuse>=5.0.4",
    "google-auth>=2.62.0",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.22.1",
]
eval = [
    "langchain<1",
    "langchain-community<0.4",
    "langchain-core<1",
    "langchain-openai<1",
    "ragas>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
